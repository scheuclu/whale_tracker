# Alert tuning and ingestion scope.

alerts:
  # A "cluster" is several members converging on the same ticker in the same
  # direction inside a rolling window — the signal this tracker exists for.
  #
  # The window is measured on the TRADE date, not the disclosure date, so it
  # has to absorb the reporting lag: members have 45 days to disclose. Over
  # the whole corpus (3,576 dated rows on 2026-10-17) the trade→filing delay
  # is a median of 25 days and a p90 of about 80 — but that tail is a handful
  # of year-long catch-up filings: 450 rows exceed 45 days and five filings
  # hold 379 of them. On 2026 trade dates alone it is p50 24 / p90 38. A
  # 30-day window is therefore only ever about half-populated; 90 days covers
  # the statutory deadline with room to spare, and the catch-up filings fall
  # outside any window by definition.
  window_days: 90

  # A cluster must clear BOTH thresholds below. They used to be alternatives,
  # and the result was noise: of the 33 cluster alerts sent between 2026-09-07
  # and 2026-10-17, 29 were under the volume floor (median estimated volume
  # $49k), 3 were a single member ("1 politicians bought"), and 1 met both.
  min_politicians: 3
  # Compared against the estimated midpoint of the window's brackets — the
  # figure the alert prints as "mid", labelled as the estimate it is.
  min_volume_usd: 500000
  # Base-rate control. 83% of equity-like rows (2,477 of 3,000) sit in the
  # lowest bracket, $1,001–$15,000, and the most widely held names collect
  # distinct traders all year regardless of any event: MSFT had 11 distinct
  # buyers in 2026 filings, META 9, AAPL 6. "3 members bought MSFT" is the
  # normal state of MSFT, not a convergence. The 2026-10-13 "5 politicians
  # bought MSFT" alert was one member at $750k–$1.5M, one with two trades of
  # $15k–$50k, and three at $1k–$15k each.
  #
  # So a member counts towards min_politicians only if the FLOORS of their
  # brackets in the window add up to this much — floors, never midpoints,
  # because the floor is the only figure the filing proves. 15,001 means
  # "more than one lowest-bracket trade". Members below the floor are named
  # in the alert but not counted. 0 turns the control off.
  min_member_floor_usd: 15001
  # There is no single-member "cluster" any more. One member's large trade is
  # already reported by that filing's own message, and the watchlist below is
  # for members whose every trade deserves an alert of its own.

  # Only real tradeable securities feed cluster alerts. Members roll Treasury
  # bills ([GS]) over constantly and hold mutual funds via managed accounts;
  # including them would bury the signal under housekeeping.
  cluster_asset_types: [ST, OP, EF, ET, CT, RS, SA]

  # Late-filing compliance. A filing whose EVERY trade was disclosed more
  # than this many days after it was made leads its Telegram message with
  # "⚠️ late by N days" and is recorded once as a `late_filing` alert — no
  # extra message. N is the longest delay in the filing minus the deadline:
  # the report was due that many days after its earliest trade, and that is
  # how far past the due date it arrived. A filing with one timely trade
  # among late ones gets no prefix; its per-trade "(Nd delay)" lines say
  # which rows were late. Delay is trade date → filing date, never the
  # report's "Notification Date" column (README: a member trading their own
  # account is notified the same day, so that column reads 0 however long
  # the filing took). 45 is the STOCK Act's deadline; 0 turns both off.
  late_filing_days: 45

  # Options are the most directional disclosure a member can make, and the
  # filing text carries the contract: 57 rows in the 2026 corpus are typed
  # [OP], and src/whale/options.py reads the kind (call/put), strike and
  # expiry out of what each row printed — a House "Description:" line such
  # as "Call options; Strike price $325; Expires 06/18/2026", eFD's "Option
  # Type: Call · Strike price: $75.00 · Expires: 2026-08-21", or a broker
  # symbol like "PUT/XSP @ 690 EXP 10/16/2026". A row whose text names no
  # contract, or both a call and a put, stays unparsed; a strike is only a
  # figure the text calls a strike ("10 puts at $11.80" is a premium).
  #
  # options_every_trade: every options trade by any member is its own alert,
  # split per transaction exactly like a watched member's filing — the
  # per-filing digest degrades to fit Telegram's limit, and the contract is
  # the detail it drops first. Sent ahead of the routine digests, which still
  # follow for a filing that holds other trades too. Off by default: it is a
  # firehose by design, and the 2026 corpus holds one 30-row options filing.
  options_every_trade: false
  # cluster_count_options: whether a parsed option counts toward a ticker's
  # direction in the cluster finder — a call as a buy, a put as a sell, and
  # selling the contract the reverse. Off (the default), a row with a parsed
  # contract counts toward neither direction. Either way a bought put is no
  # longer read as a buy, which is what the action column alone used to say.
  cluster_count_options: false

# Members whose every trade is worth its own alert, immediately.
#
# A watched member's filing is split: each transaction arrives as its own
# WATCHLIST message rather than one per-filing digest, because the digest
# degrades (context, then asset detail, then transactions) to fit Telegram's
# 4096-character limit — and a 40-transaction filing is exactly when that
# truncation would hide the trade you were watching for.
#
# Watched filings also ignore `ingest.max_filing_age_days`: that cutoff exists
# to stop a first run replaying a year of everyone's history, and someone
# named here is the case it is not protecting against. It is still bounded by
# `ingest.years`, so the most a first run can replay is that year's filings
# for these members (Pelosi files ~3 times a year).
#
# `bioguide_id` is authoritative and is checked first; `name` is the fallback
# for a filing the roster failed to match, and is what labels the alert. A
# malformed bioguide_id is refused at load rather than quietly falling back to
# the name, which would look like it worked.
watchlist:
  - name: Nancy Pelosi
    bioguide_id: P000197
    every_trade: true

dashboard:
  # Public URL of the Vercel deployment, e.g. https://whale-tracker.vercel.app
  # — no trailing slash needed. A routine filing with more than 40
  # transactions is reported as a summary (largest trades in full, the rest
  # by bracket) that links to the member's page for the full table. Unset,
  # the link is the relative path (/politicians?m=...): correct, but Telegram
  # will not make it clickable.
  url: "https://whaletracker-blue.vercel.app"

ingest:
  years: [2026]
  # On first sight of a filing, anything older than this is recorded but never
  # notified — it stops the first run blasting a year of history to Telegram.
  #
  # 14, not 7, because the Clerk's index lags the filing date and a filing
  # that is already older than this when it first appears is filed as history
  # and never announced. Measured on filings dated 2026-09-08 or later, the
  # days between filing_date and the run that first saw it were: Friday mean
  # 4.3 (max 6), Thursday mean 2.6 (max 7), Monday/Tuesday 1.0 (max 1). At 7
  # the cutoff equalled the worst case already observed, so an ordinary
  # slow week would have silently swallowed a routine filing. The first-run
  # replay this protects against is still bounded by `years`. A filing that
  # hits the cutoff on any run after the first is logged and counted in
  # sync_state (`house_age_cutoff`), which the weekly audit reports.
  max_filing_age_days: 14

senate:
  # Senate PTRs come from the eFD search (efdsearch.senate.gov): the index of
  # recent reports, then each electronic report page, parsed by
  # senate_ptr.py into the same vocabulary as House filings. Paper filings
  # are scanned images and are reported unreadable, like House scans.
  #
  # eFD answers GitHub's US runners without a proxy (first observed
  # 2026-10-17, "ok: 100 filings seen"). Its Akamai front refuses non-US
  # addresses with a 403; if it ever starts refusing the runner, set the
  # SENATE_PROXY_URL secret to a *sticky* US proxy — the agreement eFD
  # requires is bound to the accepting IP. A refusal or failure is recorded in
  # sync_state and the run carries on with House data; it never raises.
  enabled: true

vision:
  # Reads scanned paper PTRs when GEMINI_API_KEY is set: Gemini transcribes
  # the written text (filer, asset names, dates, owner), and src/whale/
  # paper_form.py reads the ticked amount and type boxes off the printed grid
  # itself. The model's own reading of the boxes was wrong on about a quarter
  # of rows (issue #1); the grid reader, measured on the 53 scanned filings
  # in the 2026 corpus, decomposed every page of 50 of them (the other three
  # are one faint page each in 30–40 page spreadsheet attachments) and, on a
  # hand-labelled set of 164 rows across 16 filings and all four form layouts
  # seen, called 161 amounts and 155 types with no wrong answers — the rest it
  # left unknown (a poor scan, an X drawn outside its box). A box it cannot
  # call is stored as unknown, never guessed. The two readings are joined
  # page by page (#51): a page whose grid cannot be found, or whose row
  # count does not match the transcription, yields no rows and is recorded
  # as such (scan_pages.error, a "partially read" note on the filing), and
  # the filing is parsed from its other pages; only a filing with no
  # readable page at all is reported as unreadable. A row whose type the
  # model read differently from the grid keeps the grid's and is flagged
  # (scan_rows.status = type_disputed); a page, or a filing, is refused for
  # that only past vision.MAX_DISPUTED_SHARE. Every refused filing is
  # retried once per vision.JOIN_VERSION, never every run.
  #
  # ON since 2026-10-17, and only because transcribed rows are quarantined,
  # not trusted: they count as trades and in member and ticker lists but
  # enter no volume total, cluster or floor (stats.counts_toward_volume;
  # TRANSCRIBED in web/lib/queries.ts), and the dashboard and Telegram label
  # them "transcribed from scan". Paper forms carry no ticker, so they can
  # never feed a cluster alert either way. The first run with this on and a
  # key re-queues the scans that failed for want of it; the ones already
  # reported to Telegram as unreadable are stored as history, not announced
  # again. Expect one model call per scanned filing, ~11% of PTRs. Every
  # transcription stays inspectable on the dashboard's Scans page next to
  # the page image it came from.
  enabled: true
  # Seconds of model time one poll run may spend on scans; 0 = no limit.
  # The first run with transcription on had 53 scans queued, spent the job's
  # whole 20-minute timeout on them and was killed before the commit step,
  # so nothing it read was kept, and the next run would have done the same.
  # Scans the budget leaves behind stay queued for the next run; a backlog
  # drains over a few runs instead of blocking one.
  budget_seconds: 480

insiders:
  # SEC Form 4: corporate officers, directors and 10% owners. Only open-market
  # or private purchases and sales (codes P and S in the non-derivative table)
  # are kept, and only when a filing's summed value in one direction reaches
  # the floor. The rest is compensation plumbing — awards, tax withholding,
  # option exercises, gifts. Roughly 420 Form 4s are filed every business day
  # and the database is committed to git every three hours; this floor is what
  # keeps that sane. Rejected filings are not stored at all.
  enabled: true
  min_trade_usd: 50000
  # 30 days, not 90: Form 4 is due two business days after the trade, so a
  # trade-date window has no 45-day reporting lag to absorb.
  cluster_window_days: 30
  min_insiders: 3
  # How much bigger a cluster must get before it is reported a second time.
  # 1.5 = "half as many insiders again". Form 4's two-business-day deadline
  # means a coordinated purchase lands as a burst over a day or two, so the
  # cluster grows on nearly every poll: Banco Bradesco went 4 -> 5 -> 10 -> 21
  # buyers in 24 hours and sent four alerts for one board purchase. Set to 1.0
  # to report every additional insider; below 1.0 is refused, because it would
  # read as tuning while doing nothing.
  cluster_refire_growth: 1.5
  # Cooldown for the filing rules below. After an alert, further filings by
  # the same primary owner in the same issuer and direction within this many
  # days are folded into history rather than sent again — unless the run's
  # cumulative value has grown to cluster_refire_growth× what was last
  # reported, when one message says "nth filing in N days, cumulative $X".
  # One accumulation programme is one decision: Nippon Life buying Corebridge
  # sent 24 alerts in 33 days, and 67 of the first 291 insider alerts were
  # repeats of that shape. The window restarts from each message sent. 0 turns
  # the cooldown off.
  filing_refire_days: 30
  # A filing older than this on first sight is history, never a notification.
  # It is what stops a first run, or a backfill, replaying days into Telegram.
  max_filing_age_days: 7
  # The live feed holds 2000 entries, about two business days or one busy
  # Monday. When a poll run is lost or late enough for the feed to roll past
  # the cursor, the sync records the missed range as a gap and the following
  # runs repair it from EDGAR's daily index — after reading the live feed, for
  # at most this many seconds per run. A gap that does not fit narrows to the
  # days still missing and continues next run; it never clears early. The
  # feed sync stops after 7 minutes and the repair after 8, which keeps the
  # insider step inside the job's 20-minute timeout. 0 switches the automatic
  # repair off and leaves the gap to `backfill-insiders`.
  gap_repair_budget_seconds: 480

  # Alert rules. Each new filing is tested against them in order and the FIRST
  # match names the alert, so specific rules must sit above general ones —
  # "Large insider buy" placed first would claim the CEO's purchase before the
  # CEO rule ever saw it. An empty list means no insider alerts at all.
  #
  # Conditions a rule may set:
  #   direction       buy | sell | any            (default any)
  #   min_value_usd   summed value of that direction's trades in one filing
  #   roles           director | officer | ten_percent_owner | other
  #   titles          case-insensitive substrings of the officer title as filed
  #   exclude_10b5_1  skip trades the filer marked as a pre-arranged plan
  #   require_10b5_1  only those trades
  #   kind: cluster   + min_insiders, window_days — several insiders at once
  #
  # A value threshold below `min_trade_usd` above cannot fire: filings under
  # that floor are never stored in the first place.
  #
  # Insiders sell vastly more than they buy — 878 of the first 944 stored
  # trades were sales, since selling is how equity compensation is realised.
  # A purchase is the scarcer signal, so it earns a lower threshold.
  alerts:
    - name: Insider cluster buying
      kind: cluster
      direction: buy
      min_insiders: 3
      window_days: 30

    # Someone who sets the guidance buying their own stock, at any size worth
    # storing. Title substrings, because the form's free-text titles vary
    # ("CEO", "Chief Executive Officer", "President and CEO").
    - name: CEO or CFO buying
      direction: buy
      titles: ["chief executive", "ceo", "chief financial", "cfo"]
      min_value_usd: 100000

    # Anyone else who runs the company buying enough to be worth a message.
    # At $250k this was 82 of the 173 insider alerts sent in the 16 days to
    # 2026-09-23 — more than the other three rules combined. $1M keeps the
    # conviction buys; the role condition keeps it to the people who set
    # guidance. Without it, 82 of the first 291 alerts had a 10% owner with
    # no officer or director flag as the primary filer — Berkshire in Lennar,
    # GoldenTree in QVC, Baker Bros in Kodiak, Nippon Life in Corebridge —
    # funds and holding companies accumulating, which is also what the
    # cooldown above exists for. Any one reporting owner satisfies `roles`,
    # so a fund filing jointly with the founder on its board still counts.
    - name: Large insider buy
      direction: buy
      roles: [officer, director]
      min_value_usd: 1000000

    # A 10% holder buying is a different signal — a position, not a view from
    # inside the building — and the routine shape of one is a long programme
    # of mid-sized filings. A much higher floor keeps only the ones that are
    # news on their own. Placed after the rule above so a fund whose joint
    # filer is a director is still reported as an insider buy.
    - name: Large 10% owner buy
      direction: buy
      roles: [ten_percent_owner]
      min_value_usd: 10000000

    # Sales are routine, so this asks for three things at once: an officer, a
    # large amount, and no 10b5-1 plan. A planned sale was scheduled months
    # ago and says little; an unplanned one was a decision made that week.
    - name: Unplanned executive sale
      direction: sell
      roles: [officer]
      # $5M, not $2M: at the lower floor this fired 43 times in 16 days and
      # every one of them was already $1M+. Selling is how equity comp is
      # realised, so the bar for a sale being news is higher than for a buy.
      min_value_usd: 5000000
      exclude_10b5_1: true

    # Available but off by default: insider *selling* clusters fire often —
    # every cluster in the first corpus was a sell — so this would be noisy.
    # - name: Insider cluster selling
    #   kind: cluster
    #   direction: sell
    #   min_insiders: 4
    #   window_days: 30
