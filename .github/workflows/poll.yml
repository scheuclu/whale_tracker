name: poll

on:
  schedule:
    # Two lines, 90 minutes apart, both off the hour. GitHub queues scheduled
    # runs and delays or drops them under load, worst at :00. Measured over
    # the 100 runs before this change (2026-09-25 → 2026-10-18, 97 of them
    # scheduled, on a single `0 */3 * * *`): the gap between runs was a
    # median 5.3 h, p90 8.5 h, max 10.6 h against the 3 h asked for, and
    # delivery ran a median 29 min (p90 54 min) past the hour. A slot GitHub
    # drops now gets a second chance 90 minutes later instead of three hours.
    # The Clerk republishes its index roughly daily, so a spare run costs one
    # more download of the same ZIP; the EDGAR feed remembers about two
    # business days, so a long gap costs missed Form 4s. The measured cadence
    # is reported by the weekly review and the Pipeline page.
    - cron: "17 */3 * * *"
    - cron: "47 1-22/3 * * *"
  workflow_dispatch:
    inputs:
      backfill_year:
        description: "Also parse this year's already-seen filings (both chambers) into the DB (no notifications). Blank = none."
        default: ""
        required: false
      insider_backfill_from:
        description: "Also load SEC Form 4 history from EDGAR's daily index, starting this day (YYYY-MM-DD). Blank = none."
        default: ""
        required: false
      insider_backfill_to:
        description: "Last day of the insider backfill, inclusive. Blank = yesterday."
        default: ""
        required: false
      capture_scans:
        description: "Also capture every scanned filing's pages and grid-reader rows into the DB for the /scans inspection view (no API key needed; resumable)."
        type: boolean
        default: false
        required: false

# One pipeline run at a time; queued rather than cancelled so a run is never
# killed mid-commit of the database.
concurrency:
  group: whale-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[vision]"

      - name: Backfill history (optional)
        if: ${{ github.event.inputs.backfill_year != '' }}
        env:
          BACKFILL_YEAR: ${{ github.event.inputs.backfill_year }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m whale backfill --year "$BACKFILL_YEAR"

      - name: Capture scans for inspection (optional)
        if: ${{ github.event.inputs.capture_scans == 'true' }}
        # The whole 2026 corpus (53 filings, 405 pages) takes a few minutes;
        # the budget keeps a larger backlog inside the job's timeout, and a
        # run that stops early continues next time.
        run: python -m whale capture-scans --budget-seconds 480

      - name: Run pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: reads scanned paper filings (~11% of PTRs).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional fallback. Senate eFD answers the runner directly (it
          # geo-fences non-US addresses, not datacenters); set this to a
          # sticky US proxy only if eFD ever starts refusing the runner.
          SENATE_PROXY_URL: ${{ secrets.SENATE_PROXY_URL }}
          # SEC requires "<project> <contact e-mail>" on every EDGAR request and
          # serves an HTML refusal page without it. Unset = insider step skips.
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        run: python -m whale run

      - name: Backfill insiders (optional)
        if: ${{ github.event.inputs.insider_backfill_from != '' }}
        env:
          FROM: ${{ github.event.inputs.insider_backfill_from }}
          TO: ${{ github.event.inputs.insider_backfill_to }}
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        # ~420 filings a day at 7 req/s is about a minute per day of history;
        # the budget keeps the job inside its timeout and the log says where
        # to resume.
        run: python -m whale backfill-insiders --from "$FROM" ${TO:+--to "$TO"} --budget-seconds 480

      # Also after a failed step: every pipeline step commits its own work,
      # so the database is consistent at any point, and a run that raised
      # has logged itself (outcome, error, what it managed) in
      # sync_state.recent_runs — the Pipeline page cannot show that unless
      # it is pushed. The job still goes red for the failed step.
      - name: Commit knowledge base
        if: ${{ !cancelled() }}
        run: |
          git config user.name "whale-bot"
          git config user.email "whale-bot@users.noreply.github.com"
          git add data/trades.sqlite3
          if git diff --cached --quiet; then
            echo "no DB changes"
            exit 0
          fi
          git commit -m "trades: update $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase || true
          done
          echo "push failed after retries" >&2
          exit 1
