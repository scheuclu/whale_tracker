name: weekly-review

# Reviews a week of pipeline output and proposes fixes as draft PRs.
#
# The evidence is gathered deterministically first — `whale audit` over the
# database, plus a digest of the poll workflow's runs and failure logs — and
# only then handed to Claude. That keeps the run cheap and reproducible, and
# means the checks are unit-tested rather than re-derived by a model each week.
#
# Without ANTHROPIC_API_KEY there is no analysis, and the evidence is filed as
# a GitHub issue ("Weekly review <date>") instead, so the week's record lands
# where a person reads it. Five green runs whose only output was an artifact
# nobody opened are why (#17).

on:
  schedule:
    # Mondays, 07:00 UTC at the earliest. GitHub queues scheduled runs and
    # delivers them late under load — the first five started between 13:45
    # and 16:35 UTC — so the hour is a lower bound, not a promise.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Produce the evidence and the analysis, but open no PR or issue"
        type: boolean
        default: false

# Never overlap with itself; a second review of the same state is pure cost.
concurrency:
  group: whale-weekly-review
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read # required to read the poll workflow's run history and logs
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      # Decide where the evidence goes: to Claude when the key exists, to a
      # GitHub issue (last step) when it does not. Never to an artifact alone.
      - name: Check credentials
        id: creds
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANTHROPIC_API_KEY is not set — no analysis or PR this week;" \
                 "the evidence is filed as a GitHub issue instead."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit the data
        id: audit
        run: python -m whale audit --out /tmp/audit.md

      # If `gh run list` itself fails, this step fails and the job goes red: an
      # unknown run history must never read as healthy. Five green runs hid
      # exactly that behind continue-on-error (#17). Only the per-run log
      # fetches further down are best-effort, because logs legitimately expire.
      - name: Digest the poll workflow's CI history
        id: digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT=/tmp/ci.md
          echo "# poll workflow — last 7 days" > "$OUT"
          echo >> "$OUT"

          # No `durationMs`: gh exposes no such field. Duration is
          # updatedAt − startedAt, which is what the UI shows for a finished run.
          gh run list --workflow=poll.yml --limit 100 \
            --json databaseId,conclusion,createdAt,startedAt,updatedAt,event \
            > /tmp/runs.json

          python - <<'PY' >> "$OUT"
          import datetime, json, statistics

          def ts(s):
              return datetime.datetime.fromisoformat(s.replace("Z", "+00:00"))

          runs = json.load(open("/tmp/runs.json"))
          now = datetime.datetime.now(datetime.timezone.utc)
          cutoff = now - datetime.timedelta(days=7)
          recent = [r for r in runs if ts(r["createdAt"]) > cutoff]
          by = {}
          for r in recent:
              k = r["conclusion"] or "in_progress"
              by[k] = by.get(k, 0) + 1
          capped = " (list capped — the window may hold more)" if len(recent) == len(runs) else ""
          print(f"- runs in window: **{len(recent)}**{capped}")
          print(f"- outcomes: {by or 'none'}")

          # Two cron lines ask for a run every 90 min, but GitHub delivers
          # scheduled runs late and unevenly — a 5.3 h median gap over Sep–Oct
          # 2026 on the earlier single 3 h line — so report the measured
          # cadence rather than a count against the cron's promise.
          # The longest gap is the one that matters: past ~2 days the EDGAR
          # feed's memory is exceeded and filings are missed.
          sched = sorted(ts(r["createdAt"]) for r in recent if r["event"] == "schedule")
          gaps = [(b - a).total_seconds() / 3600 for a, b in zip(sched, sched[1:])]
          if gaps:
              print(f"- scheduled runs: {len(sched)}; gap between them: "
                    f"median {statistics.median(gaps):.1f} h, max {max(gaps):.1f} h "
                    f"(cron asks for every 90 min; GitHub delivers it late)")
              print(f"- hours since the last scheduled run: "
                    f"{(now - sched[-1]).total_seconds() / 3600:.1f}")
          else:
              print(f"- scheduled runs: {len(sched)} — too few to measure the cadence")

          durations = sorted((ts(r["updatedAt"]) - ts(r["startedAt"])).total_seconds()
                             for r in recent
                             if r["conclusion"] and r.get("startedAt") and r.get("updatedAt"))
          if durations:
              print(f"- duration (startedAt → updatedAt): "
                    f"median {statistics.median(durations):.0f}s, max {max(durations):.0f}s")
          failed = [r["databaseId"] for r in recent if r["conclusion"] == "failure"]
          print(f"- failed run ids: {failed or 'none'}")
          # Trailing newline on every line, or `read` below drops the last id.
          open("/tmp/failed_ids.txt", "w").write("".join(f"{i}\n" for i in failed))
          PY

          # Failure logs, trimmed — full logs are far too long to reason over.
          # Best-effort per run: logs expire, and a fetch can hiccup.
          if [ -s /tmp/failed_ids.txt ]; then
            echo >> "$OUT"; echo "## Failure logs" >> "$OUT"
            while read -r id; do
              [ -n "$id" ] || continue
              echo >> "$OUT"; echo "### run $id" >> "$OUT"
              echo '```' >> "$OUT"
              gh run view "$id" --log-failed 2>/dev/null | tail -60 >> "$OUT" || \
                echo "(logs unavailable — may have expired)" >> "$OUT"
              echo '```' >> "$OUT"
            done < /tmp/failed_ids.txt
          fi

          # A run can succeed and still do nothing useful. Warnings in a green
          # run are the most under-watched signal in the pipeline. A log that
          # could not be fetched is reported as such, never as "(none)".
          echo >> "$OUT"; echo "## Warnings in the latest successful run" >> "$OUT"
          echo '```' >> "$OUT"
          LATEST=$(jq -r '[.[] | select(.conclusion=="success")][0].databaseId' /tmp/runs.json)
          if [ "$LATEST" = "null" ]; then
            echo "(no successful run in the list)" >> "$OUT"
          elif gh run view "$LATEST" --log > /tmp/latest.log 2>/dev/null; then
            echo "run $LATEST:" >> "$OUT"
            grep -iE "warning|error|exception|traceback|failed|skipping" /tmp/latest.log \
              | grep -viE "no DB changes" | tail -40 >> "$OUT" || echo "(none)" >> "$OUT"
          else
            echo "(log for run $LATEST unavailable — may have expired)" >> "$OUT"
          fi
          echo '```' >> "$OUT"

          cat "$OUT"

      # Runs even when a step above failed — the audit is the more valuable
      # half and must not be lost to a digest failure — but a half that did not
      # complete is written up as unknown, never left blank or partial.
      # `!cancelled()` rather than `always()` so a cancelled run posts nothing.
      - name: Combine the evidence
        if: ${{ !cancelled() }}
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          DIGEST_OUTCOME: ${{ steps.digest.outcome }}
        run: |
          if [ "$AUDIT_OUTCOME" != "success" ]; then
            printf '%s\n' "# data audit" "" \
              "Audit unavailable this run (step outcome: $AUDIT_OUTCOME) — treat the" \
              "data as unchecked rather than clean. See the run log." > /tmp/audit.md
          fi
          if [ "$DIGEST_OUTCOME" != "success" ]; then
            printf '%s\n' "# poll workflow" "" \
              "CI digest unavailable this run (step outcome: $DIGEST_OUTCOME) — treat" \
              "the pipeline's run history as unknown rather than healthy. See the run log." > /tmp/ci.md
          fi
          {
            cat /tmp/audit.md
            echo; echo "---"; echo
            cat /tmp/ci.md
          } > /tmp/evidence.md
          wc -c /tmp/evidence.md

      # Keep the evidence whatever else happens — it is the week's record.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: weekly-evidence
          path: /tmp/evidence.md
          retention-days: 90

      - uses: anthropics/claude-code-action@v1
        if: ${{ !cancelled() && steps.creds.outputs.configured == 'true' }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-opus-5
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(python:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*),Bash(sqlite3:*),Bash(cat:*),Bash(ls:*)"
            --max-turns 60
          prompt: |
            You are reviewing one week of output from the whale_tracker
            pipeline, which tracks two sources: US House STOCK Act disclosures
            (PDF, bracketed amounts) and SEC Form 4 corporate-insider filings
            (XML, exact values). Read CLAUDE.md first — it states the project's
            invariants for both, and they bind you too.

            The evidence is at /tmp/evidence.md: a data audit produced by
            `python -m whale audit` (checks live in src/whale/audit.py) and a
            digest of the `poll` workflow's runs and logs. Read it in full before
            forming a view.

            YOUR JOB

            Decide whether anything is actually wrong or clearly worth improving,
            and if so open ONE draft pull request fixing the single most valuable
            thing. Depth over breadth: one well-understood fix with a regression
            test beats five speculative edits.

            HOW TO JUDGE

            - Investigate before believing. An audit finding is evidence, not a
              verdict. Read the code path and, where it helps, query
              data/trades.sqlite3 to see the actual rows. Several checks have
              produced false positives before — a ticker colliding with an
              asset-type code (ST is Sensata) and "Spouse/DC Over $1,000,000"
              both looked like bugs and were not.
            - A check that fires every week on something benign is itself a
              defect. Fixing the check is a legitimate outcome.
            - Prefer silent-corruption bugs over cosmetics. This project's
              failure mode is plausible-looking wrong numbers, not crashes.
            - The two sources fail differently. A House PTR is parsed out of a
              PDF by word coordinates, so suspect a mis-split column. A Form 4
              is structured XML, so parsing rarely breaks — suspect *coverage*
              instead: a throttled or stalled EDGAR sync stores nothing and
              reports success, and the insider totals quietly stop growing.
              `edgar_status`, `edgar_cursor` and `edgar_gap` in `sync_state`
              are the evidence; the audit surfaces them.

            DO NOT

            - Do not open a PR if nothing merits one. Saying "nothing to fix" is
              the correct and expected outcome most weeks. Never invent work.
            - Do not re-report known, documented limitations. These are
              decisions, not bugs: scanned filings and vision accuracy (issue
              #1), Senate eFD being blocked, congressional amounts being
              ranges, filer date typos, and — on the insider side — the $50k
              open-market floor, amendments (4/A), Forms 3 and 5 and the
              derivative table not being ingested, insider Telegram alerts not
              existing yet, and the feed's ~2-business-day memory.
            - Insider invariants worth knowing before you call something a bug:
              a value is `shares × price as filed` stored as min = max = exact
              (NULL, never 0, when the filing gives no price); `late` is derived
              once in Python against a two-business-day deadline and SQL only
              reads it; "distinct insiders" means primary reporting owners, so
              a joint filing counts once.
            - Do not modify data/trades.sqlite3. It is pipeline state owned by the
              poll workflow, and a PR touching it will conflict.
            - Do not edit .github/workflows/ — the Actions token cannot push
              workflow changes and the push will fail. Describe such a change in
              the PR body instead.
            - Do not relax or delete a test to make something pass.

            IF YOU OPEN A PR

            - Branch from main, named `weekly-review/<short-slug>`.
            - Run `python -m pytest -q` and make sure it passes.
            - Add a regression test that fails without your fix.
            - Open it as a DRAFT: `gh pr create --draft`.
            - In the body: the evidence that led you here, why it is a real
              defect, what you changed, and what you deliberately left alone.
              State your uncertainty plainly where you have any.

            IF YOU DO NOT

            Post nothing and create nothing. Print a short summary of what you
            checked and why it was fine — the run log is the record.

            ${{ inputs.dry_run && 'DRY RUN: analyse and report, but do not create a branch or PR.' || '' }}

      # No key, no analysis — but never silence. File the evidence where a
      # person will see it: a new issue each week, or a comment on an earlier
      # week's issue while that is still open, so an unreviewed week is not
      # buried under the next one. Uses GITHUB_TOKEN (`issues: write` above).
      - name: File the evidence as a GitHub issue
        if: ${{ !cancelled() && steps.creds.outputs.configured != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%F)
          TITLE="Weekly review $TODAY"
          {
            echo "## Weekly review $TODAY"
            echo
            echo "Evidence gathered by the \`weekly-review\` workflow ([run]($RUN_URL); job status at filing time: \`$JOB_STATUS\`)."
            echo
            echo "\`ANTHROPIC_API_KEY\` is not configured, so nothing has analysed this. A person needs to read it, decide whether anything is actually wrong, and close the issue. While it stays open, later weeks are appended as comments."
            echo
            cat /tmp/evidence.md
          } > /tmp/issue.md

          # GitHub rejects bodies over 65,536 characters. Cut, and say so — the
          # complete evidence is the artifact uploaded above. The fence before
          # the note closes a code block the cut may have landed inside.
          LIMIT=60000
          if [ "$(wc -c < /tmp/issue.md)" -gt "$LIMIT" ]; then
            head -c "$LIMIT" /tmp/issue.md > /tmp/issue.cut
            printf '\n```\n\n**Truncated at %s bytes** — the complete evidence is the `weekly-evidence` artifact on the run.\n' \
              "$LIMIT" >> /tmp/issue.cut
            mv /tmp/issue.cut /tmp/issue.md
          fi

          # An open "Weekly review YYYY-MM-DD" from an earlier week takes this
          # week's evidence as a comment. The pattern is strict on purpose: a
          # search on the prefix alone also matches issues *about* the review
          # (#17 is one), and the oldest open one wins so comments stay in order.
          EXISTING=$(gh issue list --state open --limit 100 --search 'in:title "Weekly review"' \
            --json number,title \
            --jq '[.[] | select(.title | test("^Weekly review [0-9]{4}-[0-9]{2}-[0-9]{2}$"))]
                  | sort_by(.number) | first | .number // empty')

          # Label only if the label exists; never create one.
          LABEL=""
          if gh label list --limit 100 --json name --jq '.[].name' | grep -qx question; then
            LABEL=question
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN — filing nothing. Would run:"
            if [ -n "$EXISTING" ]; then
              echo "  gh issue comment $EXISTING --body-file /tmp/issue.md"
            else
              echo "  gh issue create --title \"$TITLE\" --body-file /tmp/issue.md ${LABEL:+--label $LABEL}"
            fi
            echo "with this body:"
            cat /tmp/issue.md
          elif [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/issue.md
            echo "::notice::Appended this week's evidence to the still-open issue #$EXISTING"
          else
            URL=$(gh issue create --title "$TITLE" --body-file /tmp/issue.md ${LABEL:+--label "$LABEL"})
            echo "::notice::Filed $URL"
          fi
