[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whale"
version = "0.1.0"
description = "Tracks US congressional stock-trade disclosures, alerts to Telegram, builds a queryable trade knowledge base"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pdfplumber>=0.11.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# numpy is the grid reader's (paper_form.py) only extra dependency and is
# imported lazily, so the package imports without it.
vision = ["google-genai>=1.0.0", "numpy>=1.26"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
